  - id: gautrain
    pattern: '(?:^|\s)gautrain(?:\s+e\s*commerce)?(?:\s|$)'
    match_type: regex
    merchant: Gautrain
    category: Transport
    subcategory: Public Transport
    confidence: high
    priority: 150

  - id: youtube_premium
    pattern: '(?:^|\s)(?:google\s*\*?\s*)?youtube\s*premium(?:\s|$)'
