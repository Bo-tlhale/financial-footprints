version: 1
rules:
  - id: uber_eats
    pattern: '(?:^|\s)(?:dl\*\s*)?uber\s+eats(?:\s|$)'
    match_type: regex
    merchant: Uber Eats
    category: Food & Dining
    subcategory: Food Delivery
    confidence: high
    priority: 200
    explanation: Specific food-delivery brand; evaluated before Uber rides.

  - id: uber_rides
    pattern: '(?:^|\s)(?:uber\s*(?:bv|trip|sa)?)(?:\s|$)'
    match_type: regex
    merchant: Uber
    category: Transport
    subcategory: Ride-Hailing
    confidence: high
    priority: 100

  - id: mr_d_food
    pattern: '(?:^|\s)mr\s+d\s+food(?:\s|$)'
    match_type: regex
    merchant: Mr D Food
    category: Food & Dining
    subcategory: Food Delivery
    confidence: high
    priority: 180

  - id: pick_n_pay
    pattern: '(?:^|\s)(?:pnp|pick\s+n\s+pay)(?:\s|$)'
    match_type: regex
    merchant: Pick n Pay
    category: Groceries
    subcategory: Supermarkets
    confidence: medium
    priority: 120
    review_required: true
    explanation: Supermarket is likely, but the retailer also sells non-grocery goods.

  - id: checkers_sixty60
    pattern: '(?:^|\s)checkers\s+(?:sixty60|60)(?:\s|$)'
    match_type: regex
    merchant: Checkers Sixty60
    category: Groceries
    subcategory: Supermarkets
    confidence: medium
    priority: 180
    review_required: true

  - id: checkers
    pattern: '(?:^|\s)checkers(?:\s|$)'
